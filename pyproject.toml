[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-analytics-runtime"
version = "0.1.0"
description = "AAR - privacy-first, hardware-aware analytics orchestration layer"
readme = "README.md"
requires-python = ">=3.10"
# SPDX expression rather than the old `license = {text = ...}` table,
# which setuptools deprecated and will stop accepting in 2027.
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AAR Contributors" }]
keywords = ["analytics", "query-planning", "arrow", "duckdb", "polars", "gpu", "air-gapped"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

# NOTE: AAR deliberately has ZERO required third-party runtime dependencies.
# The core (IR, planner, cost model, policy engine, lineage, failure registry,
# explain output, and the whole Workbench UI) runs on the Python standard
# library alone. Every engine is optional and probed at runtime; absence
# degrades gracefully and is logged rather than raising.
dependencies = []

[project.optional-dependencies]
arrow     = ["pyarrow>=14"]
excel     = ["openpyxl>=3.1"]
duckdb    = ["duckdb>=0.10"]
polars    = ["polars>=1.0"]
pandas    = ["pandas>=2.0"]
sql       = ["psycopg[binary]>=3.1", "pymongo>=4.6"]
# RAPIDS cuDF for the T4/Colab path. cu12 because Colab and current
# drivers are CUDA 12; there is a separate cu11 extra for older hosts.
gpu       = ["cudf-cu12>=24.4", "pynvml>=11.5"]
gpu-cu11  = ["cudf-cu11>=24.4", "pynvml>=11.5"]
dev       = ["pytest>=7.4", "pyarrow>=14", "openpyxl>=3.1", "duckdb>=0.10", "polars>=1.0"]
# Everything except the GPU stack, which needs a matching CUDA and is
# deliberately opt-in: pulling cudf on a CPU-only host fails at install
# time rather than degrading, which would break `pip install aar[all]`
# for the majority of users who do not have a GPU.
all       = ["adaptive-analytics-runtime[arrow,excel,duckdb,polars,pandas,sql]"]

[project.scripts]
aar = "aar.cli:main"

[project.urls]
Homepage = "https://github.com/faizansk25/AAR"
Repository = "https://github.com/faizansk25/AAR.git"
Issues = "https://github.com/faizansk25/AAR/issues"

[tool.setuptools.packages.find]
where = ["src"]

# The Workbench ships its own HTML, CSS and JS. Without this the wheel
# installs cleanly and then `aar workbench` 404s on every asset, which is
# exactly the kind of failure that only appears after publishing.
[tool.setuptools.package-data]
"aar.workbench" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --durations=10"
markers = [
  "slow: long-running calibration or large-data tests",
  "gpu: requires a CUDA GPU",
]
filterwarnings = ["ignore::DeprecationWarning"]
