name: CI

# Every push and pull request runs the suite on every supported Python, on
# Linux, macOS and Windows. Three platforms because the failures this suite
# exists to catch are platform-shaped: line endings, block sizes, and
# filesystem path handling all changed behaviour in the profiler, and a
# single-platform run would not have seen any of them.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref, newest wins. Without this every push queues another full
# six-job matrix, so a burst of commits produces a burst of failure emails
# for runs whose results nobody will ever read - and the stale ones keep
# failing long after the fix has landed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Every combination reports. With fail-fast the first failure cancels
      # the rest, so one broken platform silently removes the evidence about
      # the other two.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Matches the versions declared in `classifiers`. Testing a version
        # the package does not claim to support, or omitting one it does,
        # are both ways for this matrix to stop meaning anything.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # Pins the cache to the manifest that defines the dependency set.
          # Pointing this at a path that does not exist makes setup-python
          # warn and skip caching, which is slower but not fatal.
          cache-dependency-path: pyproject.toml

      - name: Install AAR and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Lint runs first and on its own, so a lint failure is reported as
      # "lint failed" rather than as a wall of test output. The suite also
      # asserts lint (tests/test_cli.py::TestNoSilentLint), so a regression
      # cannot slip through by skipping this step.
      - name: Lint
        run: python -m ruff check src tests

      - name: Verify every module parses
        run: python tools/check_syntax.py

      # The count assertion inside the suite compares the README against
      # what pytest collects *in this environment*. Installing `.[dev]`
      # rather than a hand-picked list is what keeps that number stable -
      # a missing dependency silently reduces the collected count, which
      # then fails as if the README were stale.
      - name: Run the test suite
        run: python -m pytest tests -q --tb=short
