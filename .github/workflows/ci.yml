name: CI

# Every push and pull request runs the suite on every supported Python, on
# Linux, macOS and Windows. Three platforms because the failures this suite
# exists to catch are platform-shaped: line endings, block sizes, and
# filesystem path handling all changed behaviour in the profiler, and a
# single-platform run would not have seen any of them.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install AAR and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Lint is a separate gate from the tests, and the suite asserts it
      # too (tests/test_cli.py::TestNoSilentLint), so a lint failure is
      # caught before the slower matrix even starts.
      - name: Lint
        run: python -m ruff check src tests

      - name: Verify every module parses
        run: python tools/check_syntax.py

      - name: Run the test suite
        run: python -m pytest tests -q --tb=short
